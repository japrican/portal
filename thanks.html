<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="img/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="img/icon180.png">
<title>ご購入ありがとうございます｜学びのミカタ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#3c3c3c;--body:#4b4b4b;--mute:#777;--line:#e5e5e5;--bg2:#f7f7f7;--green:#58cc02;--green-d:#58a700;--blue-d:#1899d6;--round:'M PLUS Rounded 1c','BIZ UDPGothic',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg2);color:var(--body);font-family:'BIZ UDPGothic','Hiragino Sans','Noto Sans JP',sans-serif;font-weight:700;line-height:1.75;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 48px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.top b{font-family:var(--round);font-weight:800;font-size:20px;color:var(--ink)}
.card{background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:20px;padding:20px;margin-bottom:14px}
.hero{text-align:center;padding:26px 20px}
.ok{width:72px;height:72px;border-radius:50%;background:var(--green);box-shadow:0 4px 0 var(--green-d);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
h1{font-family:var(--round);font-weight:800;font-size:21px;color:var(--ink);line-height:1.4}
.what{margin-top:8px;font-size:16px;color:var(--ink)}
.what em{font-style:normal;color:var(--green-d)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;border-radius:16px;font-family:var(--round);font-weight:800;font-size:17px;margin-top:16px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-d)}
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.apps a{display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:10px 4px;font-size:13px;color:var(--ink)}
.apps i{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-family:var(--round);font-weight:800;font-size:19px}
h2{font-family:var(--round);font-weight:800;font-size:17px;color:var(--ink);display:flex;align-items:center;gap:8px;margin-bottom:6px}
h2 span{flex:none;width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center}
.card p,.card li{font-size:14px}
.card ol{padding-left:1.3em;margin-top:4px}
.note{font-size:13px;color:var(--mute);margin-top:6px}
.warn{background:#fff6e5;border-color:#ffd38a}
.warn h2 span{background:#ff9600}
.copy{margin-top:10px;width:100%;min-height:46px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:#fff;font:inherit;font-family:var(--round);font-weight:800;font-size:15px;color:var(--blue-d);cursor:pointer}
.err{text-align:center}
footer{text-align:center;font-size:13px;color:var(--mute);margin-top:22px}
footer a{color:var(--blue-d)}
</style>
</head>
<body>
<div class="wrap">
 <div class="top"><svg viewBox="0 0 512 512" width="36" height="36" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#58cc02"/><path d="M256 250V170" stroke="#fff" stroke-width="22" stroke-linecap="round"/><path d="M256 182C256 130 214 100 158 104C156 160 196 190 256 182Z" fill="#fff"/><path d="M256 170C256 124 292 96 346 98C348 150 312 178 256 170Z" fill="#e9ffd6"/><path d="M84 268C140 248 206 252 256 284C306 252 372 248 428 268V392C372 374 306 378 256 408C206 378 140 374 84 392Z" fill="#fff"/><path d="M256 284V408" stroke="#58cc02" stroke-width="12"/></svg><b>学びのミカタ</b></div>
 <div id="main"></div>
 <footer>うまく使えないときは、購入時のメールを添えて<br><a href="mailto:studypartnerforkids@gmail.com">studypartnerforkids@gmail.com</a> までご連絡ください。<br><br><a href="./">学びのミカタ トップへ</a></footer>
</div>
<script>
const B='https://manabino-mikata.com/';
const SHO=[['sansu','さんすう','さ','#ff8a00'],['kokugo-sho','こくご','こ','#e8508a'],['kanji','かんじ','か','#ff4b4b'],['eigo','えいご','え','#ce82ff'],['shakai-sho','しゃかい','し','#2b8be6'],['rika-sho','りか','り','#12b5a6']];
const CHU=[['math','数学','数','#ff8a00'],['english','英語','英','#ce82ff'],['science','理科','理','#12b5a6'],['Kokugo','国語','国','#e8508a'],['shakai','社会','社','#2b8be6'],['rekishi','歴史','歴','#a8650a']];
/* p= の値 → [表示名, 保存するキー, 値, 開くアプリ（セットは一覧）] */
const P={
 sho:['小学生6教科セット',['bundle_sho_unlocked_v1','1'],SHO],
 chu:['中学生6教科セット',['bundle_unlocked_v1','true'],CHU],
 kids:['学びのミカタ キッズ',['app_unlocked_kids','1'],'kids']
};
SHO.forEach(([r,n])=>P[r]=[n,['app_unlocked_'+r,'1'],r]);
const CHU_ID={math:'math',english:'english',science:'science',Kokugo:'kokugo',shakai:'shakai',rekishi:'history'};
CHU.forEach(([r,n])=>P[r]=[n,['app_unlocked_'+CHU_ID[r],'true'],r]);
P.kokugo=P.Kokugo;P.history=P.rekishi;

const ok=k=>{try{localStorage.setItem(k[0],k[1]);return localStorage.getItem(k[0])===k[1]}catch(e){return false}};
const ua=navigator.userAgent||'';
const inApp=/Instagram|FBAN|FBAV|Line\/|TikTok|musical_ly|BytedanceWebview|Twitter/i.test(ua);
const ios=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const pid=new URLSearchParams(location.search).get('p');
const it=P[pid];
const $m=document.getElementById('main');

if(!it){
 $m.innerHTML=`<div class="card err"><h1>ページを開けませんでした</h1><p class="what">購入完了のURLが正しくないようです。</p><p class="note">お手数ですが、購入時のメールを添えて下のアドレスまでご連絡ください。すぐに対応します。</p></div>`;
}else{
 const [name,key,dest]=it;
 const saved=ok(key);
 let autoMsg='';try{const L=localStorage,n=(ks,v)=>ks.filter(k=>L.getItem('app_unlocked_'+k)===v).length;
  if(!L.getItem('bundle_sho_unlocked_v1')&&n(['sansu','kokugo-sho','kanji','rika-sho','shakai-sho','eigo'],'1')>=4){L.setItem('bundle_sho_unlocked_v1','1');autoMsg='小学生の単品が4教科そろったので、6教科すべて使えるようにしました。'}
  if(L.getItem('bundle_unlocked_v1')!=='true'&&n(['math','english','science','kokugo','shakai','history'],'true')>=4){L.setItem('bundle_unlocked_v1','true');autoMsg='中学生の単品が4教科そろったので、6教科すべて使えるようにしました。'}}catch(e){}
 if(window.gcEv)gcEv('purchase/'+pid,'購入完了 '+name);else window.addEventListener('load',function(){window.gcEv&&gcEv('purchase/'+pid,'購入完了 '+name)});
 const set=Array.isArray(dest);
 const go=set?`<div class="apps">${dest.map(([r,n,l,c])=>`<a href="${B}${r}/"><i style="background:${c}">${l}</i>${n}</a>`).join('')}</div>`
             :`<a class="btn" href="${B}${dest}/">さっそく はじめる ▶</a>`;
 let h=`<div class="card hero"><div class="ok"><svg viewBox="0 0 24 24" width="40" height="40"><path d="M6 12.5l4 4 8-9" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <h1>ご購入ありがとうございます</h1>
  <p class="what"><em>${name}</em>が${set?'、6教科すべて':''}使えるようになりました。</p>
  ${autoMsg?`<p class="note" style="color:#58a700;font-weight:800">${autoMsg}</p>`:''}
  ${saved?'':'<p class="note">※ブラウザの設定で保存ができませんでした。プライベートブラウズを切って、このページをもう一度開いてください。</p>'}
  ${set?'<p class="note">使いたい教科をえらんでください</p>':''}${go}</div>`;
 if(inApp){
  h+=`<div class="card warn"><h2><span>!</span>SafariかChromeで開き直してください</h2>
   <p>今は${/Instagram/i.test(ua)?'Instagram':/Line\//i.test(ua)?'LINE':/TikTok|musical_ly|Bytedance/i.test(ua)?'TikTok':'アプリ'}の中の画面で開いています。このままだと、Safari・Chromeで開いたときに「購入済み」になりません。</p>
   <ol><li>下のボタンでこのページのリンクをコピー</li><li>${ios?'Safari':'Chrome'}を開いて、アドレス欄にはりつけて開く</li></ol>
   <p class="note">画面右上（または右下）の「…」から「ブラウザで開く」を選んでも開き直せます。</p>
   <button class="copy" id="cp">このページのリンクをコピー</button></div>`;
 }
 h+=`<div class="card"><h2><span>1</span>ホーム画面に追加しておくと安心です</h2>
   <p>アプリのようにすぐ開けて、購入の記録も消えにくくなります。</p>
   <ol>${ios?'<li>Safariの下にある共有ボタン（□に↑）をタップ</li><li>「ホーム画面に追加」をタップ</li>':'<li>Chromeの右上の︙メニューをタップ</li><li>「ホーム画面に追加」をタップ</li>'}</ol>
   <p class="note">使う教科のページを開いてから追加してください。</p></div>
  <div class="card"><h2><span>2</span>このページをブックマークしてください</h2>
   <p>もし「購入済み」が消えてしまっても、このページを開けば、もう一度使えるようになります。別の端末で使うときも、その端末でこのページを開いてください。</p>
   <p class="note">ご家庭でお使いの端末でご利用ください。リンクをほかの人に共有するのはご遠慮ください。</p></div>`;
 $m.innerHTML=h;
 const cp=document.getElementById('cp');
 if(cp)cp.onclick=()=>{const u=location.href;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>cp.textContent='コピーしました！').catch(()=>{prompt('このリンクをコピーしてください',u)})};
}
</script>
<script data-goatcounter="https://manabinomikata.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script>/* アクセス解析：購入ボタンのクリックと購入完了を記録（個人は特定しない） */
window.gcEv=function(p,t,n){n=n||0;if(window.goatcounter&&window.goatcounter.count){try{window.goatcounter.count({path:p,title:t||p,event:true})}catch(e){}}else if(n<20)setTimeout(function(){gcEv(p,t,n+1)},300)};
document.addEventListener('click',function(e){var el=e.target.closest&&e.target.closest('a[href*="buy.stripe.com"],button[onclick*="goBuy"],a[data-buy]');if(!el)return;var app=location.pathname.split('/')[1]||'top',set=/goBuySet/.test(el.getAttribute('onclick')||'')||/セット/.test(el.textContent||'');gcEv('buy-click/'+app+(set?'/set':'/single'),'購入ボタン '+app+(set?' セット':' 単品'))},true);</script>
</body>
</html>
