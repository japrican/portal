<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>学びの地図</title>
<meta name="description" content="小学1年〜中学3年で学ぶことを、教科ごとの冒険マップで見える化。学びのミカタのアプリでクリアしたステージが自動で届きます。">
<meta name="theme-color" content="#1f6fc9">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Cpath d=%22M12 2.6l2.8 6 6.5.7-4.9 4.4 1.4 6.4L12 16.8l-5.8 3.3 1.4-6.4L2.7 9.3l6.5-.7z%22 fill=%22%23ffbf1f%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* VOICE: 冒険のはじまり。明るく、はげまして、次の一歩を見せる
   IDEA: すごろくの冒険マップ。学年ごとに「ワールド」があり、単元は道の上のステージ
   PICTURE: くねくね道とステージ、つぎはここ！の旗、ゴールのメダル。進むと道に色がつく
   COLOUR and TYPE: 学年ごとのワールド色を1色ずつ、星は金色、白地／Zen Maru Gothic
   LAYOUT: 上にワールド色の帯（つぎのめあて）、ワールド切替、道のマップ、下に地図／足あと */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0f1720);--ink:light-dark(#1b2430,#eef2f7);--sub:light-dark(#5b6675,#a3afbd);
--line:light-dark(#e3e8ef,#2a3646);--card:light-dark(#ffffff,#17212d);--soft:light-dark(#f2f5f9,#1c2734);
--gold:#ffbf1f;--w:#b5530c}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;overflow-x:clip;padding-bottom:90px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.hero{background:var(--w);color:#fff;position:relative;overflow:hidden;transition:background .4s}
.hills{position:absolute;inset:auto 0 0 0;width:100%;height:70px;display:block}
.hin{position:relative;max-width:640px;margin:0 auto;padding:18px max(5vw,16px) 56px;display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:12px;align-items:center}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;font-size:15px;grid-column:1/-1}
.home{color:#fff;text-decoration:none;font-weight:700;min-height:44px;display:inline-flex;align-items:center}
.home:focus-visible{outline:3px solid #fff;outline-offset:2px;border-radius:6px}
.stars{background:rgba(0,0,0,.18);border-radius:999px;padding:4px 12px 4px 8px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.stars svg{width:20px;height:20px}
.eyebrow{font-size:15px;opacity:.95;margin:0}
.goal{font-size:clamp(28px,6.5vw,44px);line-height:1.1;font-weight:900;margin:4px 0 8px;text-wrap:balance}
.goal.lg{font-size:clamp(23px,5.2vw,36px)}.goal.xl{font-size:clamp(20px,4.4vw,30px)}
.left{word-break:keep-all;overflow-wrap:anywhere;font-size:17px;font-weight:700;margin:0 0 10px}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.dots i{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.3)}
.dots i.h{background:#fff8d6}.dots i.d{background:var(--gold);box-shadow:0 0 0 2px #fff}
.go{border:0;background:#fff;color:var(--w);border-radius:999px;padding:12px 22px;min-height:48px;font-weight:900;font-size:17px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.mas{align-self:end;text-align:center}
.mas svg{width:110px;height:auto;display:block;margin:0 auto}
.bub{background:#fff;color:#1b2430;border-radius:14px;padding:8px 10px;font-size:13px;white-space:nowrap;font-weight:700;line-height:1.4;margin-bottom:6px;position:relative}
.bub:after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fff}
.lv{display:flex;gap:8px;max-width:640px;margin:0 auto;padding:16px max(5vw,16px) 0}
.lvb{flex:1;max-width:200px;border:2px solid var(--line);background:var(--card);border-radius:14px;min-height:48px;font-weight:900;font-size:17px}
.lvb.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.lvh{font-size:16px;color:var(--sub);margin:14px 0 2px}
.subs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px max(5vw,16px) 0;max-width:640px;margin:0 auto}
.sb{display:flex;align-items:baseline;justify-content:center;flex-wrap:wrap;column-gap:5px;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 6px;min-height:46px;font-size:15px;line-height:1.3}
.sb small{font-size:13px;color:var(--sub)}
.sb.on{background:var(--sc);border-color:var(--sc);color:#fff}.sb.on small{color:#fff;opacity:.9}
.srow{display:grid;grid-template-columns:3.2em minmax(0,1fr);align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.srow b{font-weight:900}
.mini{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.mm{border:0;background:none;padding:2px;min-height:44px}.mm svg{width:100%;max-width:52px;height:auto;display:block;margin:0 auto}
.ph{display:block}
.worlds{display:grid;gap:6px;padding:10px max(5vw,16px) 6px;max-width:640px;margin:0 auto}
.wb{display:flex;flex-direction:column;align-items:center;gap:1px;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:7px 2px;font-weight:700;font-size:14px}
.wb .c{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:16px}
.wb small{font-size:13px;color:var(--sub);font-weight:500}
.wb.on{border-color:var(--wc);box-shadow:0 0 0 2px var(--wc) inset}
.wname{max-width:640px;margin:10px auto 0;padding:0 max(5vw,16px);font-size:24px;font-weight:900}
.wname span{display:block;font-size:14px;color:var(--sub);font-weight:500}
.road{position:relative;max-width:560px;margin:8px auto 0}
.road>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.st{position:absolute;transform:translate(-50%,-38px);display:flex;flex-direction:column;align-items:center;width:140px;border:0;background:none;padding:0}
.st .o{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card);border:4px dashed var(--line);font-size:26px;font-weight:900;color:var(--sub);position:relative;box-shadow:0 5px 0 var(--line);transition:transform .2s}
.st:active .o{transform:translateY(3px)}
.st .o>svg{width:42px;height:42px;flex:none}
.st.s1 .o{border:4px solid var(--gold);background:light-dark(#fff7d9,#2c2614);color:#b07d00}
.st.s2 .o{border:4px solid var(--gold);background:var(--gold);box-shadow:0 5px 0 #d99a00}
.st .t{margin-top:8px;font-weight:700;font-size:14px;line-height:1.3;text-align:center;background:var(--bg);border-radius:8px;padding:2px 6px}
.st.nx .o{border:4px solid var(--w);color:var(--w);animation:pulse 1.6s ease-in-out infinite}
.flag{position:absolute;top:24px;left:86px;background:var(--w);color:#fff;font-size:13px;font-weight:900;border-radius:8px;padding:3px 8px;white-space:nowrap}
.flag:after{content:"";position:absolute;left:-6px;top:50%;margin-top:-6px;border:6px solid transparent;border-left:0;border-right-color:var(--w)}
.flag.l{left:auto;right:86px}.flag.l:after{left:auto;right:-6px;border:6px solid transparent;border-right:0;border-left-color:var(--w)}
@keyframes pulse{0%,100%{box-shadow:0 5px 0 var(--line),0 0 0 0 color-mix(in srgb,var(--w) 45%,transparent)}50%{box-shadow:0 5px 0 var(--line),0 0 0 14px transparent}}
.start{position:absolute;left:50%;top:6px;transform:translateX(-50%);font-weight:900;color:var(--sub);font-size:14px}
.gl .o{width:96px;height:96px;border:0;border-radius:50%;background:var(--soft);box-shadow:none}
.gl.ok .o{background:var(--w)}
.gl .o>svg{width:64px;height:64px}
.note{max-width:640px;margin:30px auto 0;padding:0 max(5vw,16px);font-size:13px;color:var(--sub)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.nav button{flex:1;max-width:220px;border:0;border-radius:14px;min-height:50px;background:transparent;font-weight:900;color:var(--sub)}
.nav button.on{background:var(--soft);color:var(--ink)}
.view{display:none}.view.on{display:block}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,15,25,.5);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.panel{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.close{float:right;border:0;background:var(--soft);border-radius:999px;width:44px;height:44px;font-size:22px}
.tag{font-size:14px;color:var(--sub);font-weight:700}
.panel h3{font-size:28px;line-height:1.2;margin:4px 0 6px;font-weight:900}
.desc{margin:0 0 16px;font-size:17px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:18px}
.seg button{border:2px solid var(--line);background:var(--bg);border-radius:16px;min-height:76px;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:15px}
.seg button svg{width:30px;height:30px}
.seg button.on{border-color:var(--gold);background:light-dark(#fff3c4,#33290f)}
.seg button.on[data-v="0"]{border-color:var(--sub);background:var(--soft)}
.panel h4{margin:16px 0 8px;font-size:15px;color:var(--sub)}
.links{display:flex;flex-direction:column;gap:6px}
.lk{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 12px;min-height:48px}
.lk svg{width:24px;height:24px;flex:none}
.lk span{flex:1}.lk small{color:var(--sub);white-space:nowrap}
.none{color:var(--sub);font-size:14px;margin:0}
.play{display:flex;align-items:center;justify-content:center;width:100%;margin-bottom:10px;border-radius:14px;background:var(--gold);color:#3a2a00;min-height:52px;font-weight:900;text-decoration:none}
.soon{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.6;color:var(--sub);margin:0 0 10px}
.nap{display:block;font-size:11px;font-weight:700;color:var(--sub);margin-top:1px}
.trace{width:100%;margin-top:16px;border:0;border-radius:14px;background:var(--w);color:#fff;min-height:52px;font-weight:900}
.chain{margin-top:10px}
.foot{max-width:640px;margin:0 auto;padding:18px max(5vw,16px)}
.foot h2{font-size:24px;margin:8px 0 12px;font-weight:900}
.medals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.md{background:var(--soft);border-radius:18px;padding:12px 6px;text-align:center;font-weight:700;font-size:14px}
.md svg{width:72px;height:72px;display:block;margin:0 auto 4px}
.md small{display:block;color:var(--sub);font-weight:500}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;margin-top:24px;align-items:start}
.tree{background:light-dark(#eaf4ff,#132235);border-radius:20px;padding:10px}
.tree svg{display:block;width:100%;height:auto}
.treecap{text-align:center;margin:4px 0 8px;font-weight:700}
.log{list-style:none;margin:0;padding:0}
.log li{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px;align-items:center}
.log li svg{width:22px;height:22px;flex:none}
.log time{color:var(--sub);flex:none;width:3.2em}
.reset{margin-top:20px;border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 14px;min-height:44px;color:var(--sub);font-size:14px}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-30px);opacity:0;z-index:30;background:#1b2430;color:#fff;border-radius:16px;padding:12px 18px;font-weight:700;text-align:center;width:max-content;max-width:calc(100vw - 32px);transition:.3s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.cf{position:fixed;z-index:31;width:10px;height:14px;border-radius:3px;pointer-events:none;animation:fall 1.3s ease-out forwards}
@keyframes fall{to{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
@media(max-width:600px){.hin{grid-template-columns:minmax(0,1fr) 96px}.mas svg{width:86px}.two{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="hero" id="hero">
  <div class="hin">
    <div class="top"><a class="home" href="./">‹ 学びのミカタ</a><span class="stars" id="stars" aria-label="できたステージの数"></span></div>
    <div id="next"></div>
    <div class="mas"><div class="bub" id="bub"></div>
      <svg viewBox="0 0 100 112" aria-hidden="true">
        <path d="M50 30 C50 22 50 18 50 12" stroke="#2f9e5b" stroke-width="4" stroke-linecap="round"/>
        <ellipse cx="38" cy="12" rx="13" ry="7" fill="#46c07a" transform="rotate(-25 38 12)"/>
        <ellipse cx="62" cy="10" rx="13" ry="7" fill="#2f9e5b" transform="rotate(25 62 10)"/>
        <circle cx="50" cy="52" r="25" fill="#fff"/><circle cx="50" cy="52" r="25" fill="none" stroke="rgba(0,0,0,.08)" stroke-width="2"/>
        <circle cx="41" cy="50" r="3.6" fill="#1b2430"/><circle cx="59" cy="50" r="3.6" fill="#1b2430"/>
        <circle cx="35" cy="58" r="4" fill="#ffb3c1"/><circle cx="65" cy="58" r="4" fill="#ffb3c1"/>
        <path d="M43 59 Q50 66 57 59" fill="none" stroke="#1b2430" stroke-width="2.6" stroke-linecap="round"/>
        <rect x="22" y="76" width="56" height="10" rx="4" fill="#e07c45"/>
        <path d="M26 86h48l-6 24H32z" fill="#c8693a"/>
      </svg>
    </div>
  </div>
  <svg class="hills" viewBox="0 0 400 70" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 40 Q60 10 130 34 T260 30 T400 28 V70 H0Z" fill="rgba(255,255,255,.18)"/>
    <path d="M0 56 Q90 30 200 52 T400 46 V70 H0Z" fill="var(--bg)"/>
  </svg>
</header>

<section class="view on" id="v-map">
  <div class="lv" id="lv"></div>
  <nav class="subs" id="subs" aria-label="教科"></nav>
  <nav class="worlds" id="worlds" aria-label="学年"></nav>
  <div class="wname" id="wname"></div>
  <div class="road" id="road"></div>
  <p class="note">ステージは学習指導要領の内容をもとに分けています。学校で習う順番は教科書によってちがいます。</p>
</section>

<section class="view" id="v-foot">
  <div class="foot">
    <h2>学年まるごとメダル</h2>
    <div class="medals" id="medals"></div>
    <h2 style="margin-top:26px">教科のメダル</h2>
    <div id="smedals"></div>
    <div class="two">
      <div class="tree"><svg id="tree" viewBox="0 0 300 270" role="img" aria-label="学びの木"></svg><p class="treecap" id="treecap"></p></div>
      <div><h2 style="font-size:20px;margin-top:0">さいきんの足あと</h2><ul class="log" id="log"></ul>
      <button class="reset" id="reset">記録をリセット</button></div>
    </div>
  </div>
</section>

<nav class="nav"><button class="on" data-view="map">冒険マップ</button><button data-view="foot">メダルと足あと</button></nav>
<div class="sheet" id="sheet"><div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="ptitle"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
{
const W=[['はじまりの丘','#b5530c'],['ひろがる海','#1f6fc9'],['ふしぎの森','#157f48'],['ちょうせんの山','#7445c9'],['はばたく空','#c2366a'],['かがやく星空','#3a52b8'],['あたらしい扉','#0b7a6e'],['ひろがる大陸','#b8461a'],['みらいの頂','#5b3fd1']];
const GL=g=>g<=6?g+'年生':'中'+(g-6);const GS=g=>g<=6?g+'年':'中'+(g-6);
const SUBJ=[
{k:'sansu',nm:'算数',app:'sansu',c:'#1f6fc9',from:1,
U:[
['1a',1,'10までのかず','ものの数をかぞえ、数字で書いたり大小をくらべたりする',[]],
['1b',1,'たし算・ひき算','あわせる・ふえる、のこり・ちがいを式に表す',['1a']],
['1c',1,'くり上がり・くり下がり','10をつくる考え方で、9+4や13−8を計算する',['1b']],
['1d',1,'100までのかず','十のまとまりで大きな数を数え、表す',['1a']],
['1e',1,'かたちあそび','箱・つつ・ボールなどの形の特ちょうを見つける',[]],
['1f',1,'ながさ・かさくらべ','じかにくらべたり、何こ分かで量をくらべたりする',[]],
['1g',1,'とけい','何時、何時半、何時何分を読む',[]],
['1h',1,'かずをせいりする','絵や図にならべて、数のちがいを見やすくする',[]],
['2a',2,'1000までのかず','百のまとまりで数を表し、数の線で大きさをとらえる',['1d']],
['2b',2,'たし算・ひき算のひっ算','2けた・3けたの計算を、位をそろえて筆算でする',['1c','1d']],
['2c',2,'かけ算九九','同じ数のいくつ分をかけ算で表し、九九をおぼえる',['1b']],
['2d',2,'分数のはじまり','もとの大きさの1/2や1/4を知る',[]],
['2e',2,'三角形と四角形','辺・頂点や直角に注目し、長方形・正方形・直角三角形を知る',['1e']],

['3c',3,'かけ算のひっ算','2・3けた×1けた、2けた×2けたを筆算でする',['2b','2c']],

['3e',3,'小数','0.1の位までの小数を知り、たし算・ひき算をする',['2h']],

    return `<button class="wb ${st.g===g?'on':''}" data-world="${g}" style="--wc:${w[1]}"><span class="c" style="background:${w[1]}">${d===L.length?'★':(g<=6?g:'中'+(g-6))}</span>${GS(g)}<small>${d}/${L.length}</small></button>`}).join('');
  const g=st.g;$('#wname').innerHTML=`${W[g-1][0]}<span>${GL(g)}の${S().nm} ステージ${ofG(g).length}こ${S().lv==='sho'&&f>1?`　（${S().nm}は${f}年生から）`:''}</span>`;
}
function renderRoad(){
  const L=ofG(st.g),nx=L.find(u=>sv(u.id)<2),n=L.length,top=70;
  const P=L.map((u,i)=>[XS[i%XS.length],top+i*H]);P.push([50,top+n*H+10]);
  const tot=top+n*H+90;
  const path=pts=>pts.map((p,i)=>i?`C${pts[i-1][0]},${pts[i-1][1]+H/2} ${p[0]},${p[1]-H/2} ${p[0]},${p[1]}`:`M${p[0]},${p[1]}`).join(' ');
  let k=0;while(k<n&&sv(L[k].id)===2)k++;
  const lit=P.slice(0,k===n?n+1:k+1);
  const all=doneN(L)===n;
  let h=`<svg viewBox="0 0 100 ${tot}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${path(P)}" fill="none" stroke="var(--soft)" stroke-width="22" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <path d="${path(P)}" fill="none" stroke="var(--line)" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    ${k>0?`<path d="${path(lit)}" fill="none" stroke="var(--w)" stroke-width="10" stroke-linecap="round" opacity=".85" vector-effect="non-scaling-stroke"/>`:''}
  </svg><div class="start">スタート</div>`;
  h+=L.map((u,i)=>{const s=sv(u.id),isN=nx&&nx.id===u.id;
    return `<button class="st s${s} ${isN?'nx':''}" data-open="${u.id}" style="left:${P[i][0]}%;top:${P[i][1]}px" aria-label="${u.nm} ${LB[s]}"><span class="o">${IC[s](i+1)}${isN?`<span class="flag ${P[i][0]>50?'l':''}">つぎはここ！</span>`:''}</span><span class="t">${u.nm}${SB[u.sk].map[u.id]?'':'<small class="nap">アプリ準備中</small>'}</span></button>`}).join('');
  h+=`<div class="st gl ${all?'ok':''}" style="left:50%;top:${P[n][1]}px"><span class="o">${medal(st.g,all,doneN(L)/n,null,st.g>6?GS(st.g):'')}</span><span class="t">${all?'クリア！':'ゴール'}</span></div>`;
  const r=$('#road');r.style.height=tot+'px';r.innerHTML=h;
}
function renderFoot(){
  $('#medals').innerHTML=W.map((w,i)=>{const g=i+1,L=ofGall(g),d=doneN(L),ok=d===L.length;
    return `<div class="md">${medal(g,ok,d/L.length,null,g>6?GS(g):'')}${GL(g)}<small>${ok?'ぜんぶクリア！':'あと'+(L.length-d)+'こ'}</small></div>`}).join('');
  $('#smedals').innerHTML=[['sho','小学生',[1,2,3,4,5,6]],['chu','中学生',[7,8,9]]].map(([lv,lab,gr])=>`<h3 class="lvh">${lab}</h3>`+SUBJ.filter(s=>s.lv===lv).map(s=>`<div class="srow"><b style="color:${s.c}">${s.nm}</b><div class="mini">${gr.map(g=>{if(!s.gs.includes(g))return '<span class="ph"></span>';const L=ofG(g,s.k),d=doneN(L);
    return `<button class="mm" data-sub="${s.k}" data-world="${g}" aria-label="${s.nm}${GS(g)} ${d}/${L.length}">${medal(g,d===L.length,d/L.length,s.c,g>6?GS(g):'')}</button>`}).join('')}</div></div>`).join('')).join('');
  const lg=st.log.slice(-15).reverse();
  $('#log').innerHTML=lg.length?lg.map(e=>{const d=new Date(e.t),u=byId[e.id];return u?`<li><time>${d.getMonth()+1}/${d.getDate()}</time>${SM[e.v]}<span>${SB[u.sk].nm}${GS(u.g)}「${u.nm}」${e.app?(e.v===2?'をアプリでクリア！':'をアプリで練習した'):e.v===2?'ができた！':e.v===1?'をならった':'をもどした'}</span></li>`:''}).join(''):'<li><span style="color:var(--sub)">ステージをタップして「ならった」「できた！」をつけると、ここに足あとがのこるよ。</span></li>';
  const c=[0,0,0];U.forEach(u=>c[sv(u.id)]++);
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const P=[];while(P.length<U.length){const x=rnd()*2-1,y=rnd()*2-1;if(x*x+y*y<=1)P.push([150+x*120,106+y*84,rnd()*180])}
  let s=`<ellipse cx="150" cy="252" rx="120" ry="12" fill="#157f48" opacity=".25"/><path d="M138 252 C140 210 142 180 132 150 L146 150 L150 120 L154 150 L168 150 C158 180 160 210 162 252 Z" fill="#9a6b45"/><path d="M150 165 L118 128 M150 175 L186 132" stroke="#9a6b45" stroke-width="7" stroke-linecap="round"/>`;
  let i=0;
  for(let k=0;k<c[2];k++,i++){const p=P[i];s+=`<ellipse cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" rx="9" ry="5.5" fill="${k%3?'#157f48':'#3cbf78'}" transform="rotate(${p[2].toFixed(0)} ${p[0].toFixed(1)} ${p[1].toFixed(1)})"/>`}
  for(let k=0;k<c[1];k++,i++){const p=P[i];s+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="#bfe6cc"/>`}
  $('#tree').innerHTML=s;
  $('#treecap').textContent=c[1]+c[2]===0?'「できた！」で葉っぱがふえるよ':`葉っぱ ${c[2]}まい・つぼみ ${c[1]}こ（全${U.length}）`;
}
function lk(x){const v=byId[x];return `<button class="lk" data-open="${x}">${SM[sv(x)]}<span>${v.nm}</span><small>${GS(v.g)}${v.sk!==st.sub?'・'+SB[v.sk].nm:''}</small></button>`}
function anc(id,set=new Set()){byId[id].pre.forEach(p=>{if(!set.has(p)){set.add(p);anc(p,set)}});return set}
function openSheet(id,trace){
  const u=byId[id],s=sv(id),sj=SB[u.sk];
  const li=ids=>ids.length?`<div class="links">${ids.map(lk).join('')}</div>`:'<p class="none">なし</p>';
  let tr='';
  if(u.pre.length){tr=trace?`<h4>さかのぼると、ここが土台だよ</h4><div class="links chain">${[...anc(id)].sort((a,b)=>byId[b].g-byId[a].g).map(lk).join('')}</div>`:`<button class="trace" data-trace="${id}">むずかしいときは：土台までさかのぼる</button>`}
  $('#panel').innerHTML=`<button class="close" data-close aria-label="とじる">×</button>
  <div class="tag">${sj.nm}・${GL(u.g)}・${W[u.g-1][0]}</div><h3 id="ptitle">${u.nm}</h3><p class="desc">${u.ds}</p>
  <div class="seg">${LB.map((l,v)=>`<button data-v="${v}" class="${v===s?'on':''}">${SM[v]}${l}</button>`).join('')}</div>
  ${sj.map[id]?`<a class="play" href="../${sj.app}/">${autoOf(id)===2?`${sj.nm}アプリでクリアずみ・もう一度あそぶ`:`${sj.nm}アプリであそぶ`}</a>`:`<p class="soon">この単元の問題は、${sj.nm}アプリにただいま準備中です。学校で習ったら「ならった」「できた！」を自分でつけてね。</p>`}
  ${tr}<h4>この前に学ぶこと</h4>${li(u.pre)}<h4>この先につながること</h4>${li(next[id]||[])}`;
  $('#panel').dataset.id=id;const wasOpen=$('#sheet').classList.contains('on');if(!wasOpen)lastFocus=document.activeElement;$('#sheet').classList.add('on');$('#panel').scrollTop=0;$('#panel .close').focus({preventScroll:true});
}
let lastFocus=null;
const closeSheet=()=>{$('#sheet').classList.remove('on');if(lastFocus&&document.contains(lastFocus))lastFocus.focus({preventScroll:true})};
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2800)}
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cs=['#ffbf1f','#b5530c','#1f6fc9','#c2366a','#157f48','#7445c9'];
  for(let i=0;i<28;i++){const e=document.createElement('i');e.className='cf';e.style.left=innerWidth/2+'px';e.style.top=innerHeight*.55+'px';e.style.background=cs[i%6];
    e.style.setProperty('--dx',(Math.random()*2-1)*innerWidth*.45+'px');e.style.setProperty('--dy',(-Math.random()*innerHeight*.45-40)+'px');document.body.appendChild(e);setTimeout(()=>e.remove(),1400)}
}
function renderAll(){fixG();renderHero();renderSubs();renderWorlds();renderRoad();renderFoot()}
function setView(v){
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
  $('#v-map').classList.toggle('on',v==='map');$('#v-foot').classList.toggle('on',v==='foot');window.scrollTo(0,0);
}
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('.sheet')){
    if(t.id==='sheet'||t.closest('[data-close]'))return closeSheet();
    const id=$('#panel').dataset.id,v=t.closest('[data-v]'),tr=t.closest('[data-trace]');
    if(v){const n=+v.dataset.v,was=sv(id);if(n!==was){st.s[id]=n;st.log.push({t:Date.now(),id,v:n});st.log=st.log.slice(-200);save();renderAll();
      if(n===2){const u=byId[id],L=ofG(u.g,u.sk),left=L.length-doneN(L);confetti();closeSheet();
        toast(left?`やったね！「${u.nm}」ができた！ あと${left}こで${GL(u.g)}の${SB[u.sk].nm}クリア`:`${GL(u.g)}の${SB[u.sk].nm}クリア！金のメダルをゲット！`);return}}
      return openSheet(id)}
    if(tr)return openSheet(tr.dataset.trace,true);
  }
  const o=t.closest('[data-open]');if(o){const u=byId[o.dataset.open];if(u.g!==st.g||u.sk!==st.sub){st.g=u.g;st.sub=u.sk;st.lv=SB[u.sk].lv;save();renderAll();setView('map')}return openSheet(u.id)}
  const lvb=t.closest('[data-lv]');if(lvb){st.lv=lvb.dataset.lv;save();renderAll();return}
  const sb=t.closest('[data-sub]'),w=t.closest('[data-world]');
  if(sb||w){if(sb){st.sub=sb.dataset.sub;st.lv=SB[st.sub].lv}if(w)st.g=+w.dataset.world;save();renderAll();setView('map');return}
  const nv=t.closest('.nav [data-view]');if(nv)setView(nv.dataset.view);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
let armed=false;
$('#reset').addEventListener('click',e=>{e.stopPropagation();if(!armed){armed=true;e.target.textContent='もう一度おすとリセットします';setTimeout(()=>{armed=false;e.target.textContent='記録をリセット'},4000);return}
  st={s:{},log:[],g:st.g,sub:st.sub,a:st.a,lv:st.lv,last:st.last};save();armed=false;e.target.textContent='記録をリセット';renderAll()});
function fromHash(){const h=location.hash.slice(1);if(SB[h]){st.sub=h;st.lv=SB[h].lv;st.last[st.lv]=h;
  const S0=SB[h],gk=S0.lv==='sho'?S0.app+'_lastg':S0.pk.replace('_prog_v2','_grade_v2');let g=parseInt((()=>{try{return localStorage.getItem(gk)}catch(e){return null}})(),10);
  if(g){if(S0.k==='chis')g=[0,7,7,7,7,8,8,8,9][g]||7;else if(S0.lv==='chu')g=g+6;if(S0.gs.includes(g))st.g=g}else st.g=S0.gs[0];save()}}
window.addEventListener('hashchange',()=>{fromHash();renderAll()});
fromHash();
function arrive(){const nw=syncApp();renderAll();if(nw.length){setTimeout(()=>{confetti();toast(`アプリでクリアした${nw.length}こが地図にとどいたよ！`)},400)}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)arrive()});
arrive();

}
</script>
</body>
